<!DOCTYPE html>
<html lang="tr">

<head>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'p-login.html';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildirimler | Guardia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/personel-style.css">

    <style>
        /* Ana Font Ayarı */
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            transition: 0.3s;
        }

        /* HEADER YAPISI */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-top: 15px;
        }

        /* Geri Butonu */
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--accent);
            transition: 0.2s;
            flex-shrink: 0;
        }

            .back-btn:active {
                transform: scale(0.9);
            }

        /* Başlık Fontu */
        h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        /* Bildirim Kartları */
        .notif-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 22px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: 0.2s;
        }

            /* Okunmamış Bildirim Vurgusu */
            .notif-card.unread {
                border-left: 4px solid var(--accent);
            }

        .icon-circle {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            background: rgba(56, 189, 248, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        .notif-content h4 {
            margin: 0 0 3px 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .notif-content p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--sub);
            line-height: 1.4;
        }

        .time-tag {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            margin-top: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Yeni Nesil Detay Modalı */
        .notif-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .notif-modal-card {
            background: var(--card);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            height: 500px;
            border-radius: 35px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body.light-mode .notif-modal-card {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-body-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 20px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

            .modal-body-content::-webkit-scrollbar {
                display: none;
            }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }



        .modal-head-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            width: 100%;
        }

        .modal-icon-circle {
            width: 65px;
            height: 65px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        body.light-mode .modal-icon-circle {
            background: #e1f5fe;
            color: #0288d1;
        }

        .modal-notif-title {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.5px;
        }


        .modal-body-content {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .modal-notif-text {
            font-size: 0.95rem;
            color: var(--sub);
            line-height: 1.7;
            margin: 0 0 15px 0;
        }

        body.light-mode .modal-notif-text {
            color: #455a64;
        }

        .modal-time-tag {
            font-size: 0.75rem;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        body.light-mode .modal-time-tag {
            color: #90a4ae;
        }

        .modal-close-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }

            .modal-close-btn:hover {
                background: rgba(255, 255, 255, 0.14);
            }

        body.light-mode .modal-close-btn {
            background: #f1f5f9;
            border: none;
            color: #0f172a;
        }

            body.light-mode .modal-close-btn:hover {
                background: #e2e8f0;
            }
    </style>
</head>

<body>
    <div class="container" style="padding: 20px;">
        <header>
            <div class="back-btn" onclick="history.back()">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
            <h2>Bildirimler</h2>
        </header>

        <div id="bildirim-alani">
        </div>
    </div>

    <div id="notifDetailModal" class="notif-modal" onclick="closeNotifModal()">
        <div class="notif-modal-card" onclick="event.stopPropagation()">

            <div class="modal-head-row">
                <div class="modal-icon-circle" id="mIcon">
                </div>
                <h3 class="modal-notif-title" id="mTitle">Başlık</h3>
            </div>

            <div class="modal-body-content">
                <p class="modal-notif-text" id="mText">Mesaj içeriği burada görünecek...</p>
                <span class="modal-time-tag" id="mTime">Dün, 14:20</span>
            </div>

            <button class="modal-close-btn" onclick="closeNotifModal()">Kapat</button>
        </div>
    </div>
    <script>
        function apiFetch(url, options = {}) {
            const token = localStorage.getItem('token');
            options.headers = {
                ...options.headers,
                'Authorization': 'Bearer ' + token
            };
            return fetch(url, options).then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP Hatası! Durum: ${res.status}`);
                }
                return res;
            });
        }

        (function uygulaTema() {
            if (localStorage.getItem('temaTercihi') === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
        })();

        function closeNotifModal() { document.getElementById('notifDetailModal').style.display = 'none'; }

        function openNotif(element, title, text, iconClass, timeText, notifId) {
            document.getElementById('mTitle').innerText = title;
            document.getElementById('mText').innerText = text;
            document.getElementById('mTime').innerText = timeText;
            document.getElementById('mIcon').innerHTML = `<i class="${iconClass}"></i>`;
            document.getElementById('notifDetailModal').style.display = 'flex';
            document.querySelector('.modal-body-content').scrollTop = 0;

            let okunanlar = JSON.parse(localStorage.getItem('okunanBildirimler') || '[]');
            if (!okunanlar.includes(notifId)) {
                okunanlar.push(notifId);
                localStorage.setItem('okunanBildirimler', JSON.stringify(okunanlar));
            }

            element.style.opacity = '0.55';
        }

        async function bildirimleriYukle() {
            const alan = document.getElementById('bildirim-alani');
            alan.innerHTML = '';
            const aktifSicil = localStorage.getItem("aktifKullanici");

            let okunanlar = JSON.parse(localStorage.getItem('okunanBildirimler') || '[]');

            try {
                const [duyuruRes, bordroRes, izinRes] = await Promise.all([
                    apiFetch('https://localhost:7183/api/IkIstatistikKontrolcusu/duyuru-listesi').catch(() => ({ ok: false })),
                    apiFetch('https://localhost:7183/api/IkBordroKontrolcusu/liste').catch(() => ({ ok: false })),
                    apiFetch('https://localhost:7183/api/IkIzinKontrolcusu/izin-listesi-getir').catch(() => ({ ok: false }))
                ]);

                if (duyuruRes.ok) {
                    const duyurular = await duyuruRes.json();
                    duyurular.forEach((d, index) => {
                        let title = d.baslik || 'Yeni Duyuru';
                        let text = d.icerik || 'İçerik bulunmuyor.';
                        const baslikSafe = encodeURIComponent(title);
                        const icerikSafe = encodeURIComponent(text);
                        const kisaIcerik = d.icerik ? d.icerik.substring(0, 45) : "";
                        const tarih = d.yayinTarihi ? new Date(d.yayinTarihi).toLocaleDateString('tr-TR') : "Yakın Zaman";

                        let idDegeri = d.id || d.Id || d.duyuruId;
                        let benzersizKimlik = new Date(d.yayinTarihi).getTime() || index;
                        let notifId = "duyuru_" + benzersizKimlik;
                        let opacityStyle = okunanlar.includes(notifId) ? 'opacity: 0.55;' : 'opacity: 1;';

                        alan.innerHTML += `
                        <div class="notif-card" style="${opacityStyle}" onclick="openNotif(this, decodeURIComponent('${baslikSafe}'), decodeURIComponent('${icerikSafe}'), 'fas fa-bullhorn', '${tarih}', '${notifId}')">
                            <div class="icon-circle"><i class="fas fa-bullhorn"></i></div>
                            <div class="notif-content">
                                <h4>${d.baslik}</h4>
                                <p>${kisaIcerik}...</p>
                                <span class="time-tag" style="margin-top: 5px;">${tarih}</span>
                            </div>
                        </div>`;
                    });
                }

                if (izinRes.ok) {
                    const izinler = await izinRes.json();
                    const personelinIzinleri = izinler.filter(i => i.sicilNo == aktifSicil);

                    personelinIzinleri.forEach((i, index) => {
                        const durumText = (i.onayDurumu || i.durum || "BEKLEMEDE").toUpperCase();
                        let ikonClass = 'fas fa-plane-departure';
                        let renkKodu = '#38bdf8';

                        if (durumText === 'ONAYLANDI') {
                            ikonClass = 'fas fa-check-circle';
                            renkKodu = '#22c55e';
                        } else if (durumText === 'REDDEDİLDİ' || durumText === 'REDDEDILDI') {
                            ikonClass = 'fas fa-times-circle';
                            renkKodu = '#ef4444';
                        }

                        let title = 'İzin Talebi Durumu';
                        const tarih = i.tarihAraligi || i.baslangicTarihi || 'Tarih Belirtilmedi';
                        let text = `İzin talebinizin durumu: ${durumText}\n\nTarih: ${tarih}\nİzin Türü: ${i.izinTuru || 'Belirtilmedi'}`;
                        const detayBaslik = encodeURIComponent(title);
                        const detayMesaji = encodeURIComponent(text);

                        let notifId = "izin_" + (i.id || i.Id || index);
                        let opacityStyle = okunanlar.includes(notifId) ? 'opacity: 0.55;' : 'opacity: 1;';

                        alan.innerHTML += `
                        <div class="notif-card" style="border-left: 4px solid ${renkKodu}; ${opacityStyle}" onclick="openNotif(this, decodeURIComponent('${detayBaslik}'), decodeURIComponent('${detayMesaji}'), '${ikonClass}', 'İzin İşlemi', '${notifId}')">
                            <div class="icon-circle" style="color: ${renkKodu}; background: ${renkKodu}15;"><i class="${ikonClass}"></i></div>
                            <div class="notif-content">
                                <h4>İzin Talebi</h4>
                                <p>Durum: <strong>${durumText}</strong></p>
                                <span class="time-tag" style="margin-top: 5px;">${tarih}</span>
                            </div>
                        </div>`;
                    });
                }

                if (bordroRes.ok) {
                    const bordrolar = await bordroRes.json();
                    bordrolar.filter(b => b.sicilNo == aktifSicil).forEach((b, index) => {
                        let title = `${b.donem} Bordrosu Yayınlandı`;
                        let text = `${b.donem} dönemi için maaş bordronuz sisteme yüklenmiştir. Durum: ${b.durum}`;
                        const baslikSafe = encodeURIComponent(title);
                        const icerikSafe = encodeURIComponent(text);

                        let notifId = "bordro_" + (b.id || b.Id || index);
                        let opacityStyle = okunanlar.includes(notifId) ? 'opacity: 0.55;' : 'opacity: 1;';

                        alan.innerHTML += `
                        <div class="notif-card" style="${opacityStyle}" onclick="openNotif(this, decodeURIComponent('${baslikSafe}'), decodeURIComponent('${icerikSafe}'), 'fas fa-file-invoice-dollar', 'Bordro Bilgisi', '${notifId}')">
                            <div class="icon-circle" style="color: #eab308; background: #eab30815;"><i class="fas fa-file-invoice-dollar"></i></div>
                            <div class="notif-content">
                                <h4>${b.donem} Bordrosu</h4>
                                <p>Durum: ${b.durum}</p>
                            </div>
                        </div>`;
                    });
                }
            } catch (error) {
                console.error("Bildirimler yüklenirken beklenmedik bir hata oluştu:", error);
            }
        }

        window.onload = bildirimleriYukle;
    </script>
</body>

</html>
