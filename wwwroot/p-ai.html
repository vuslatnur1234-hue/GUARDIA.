<!DOCTYPE html>
<html lang="tr">

<head>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardia | Yapay Zeka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/personel-style.css">

    <style>
        body {
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
            overflow: hidden;
        }

        .ai-welcome {
            padding: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

            .ai-welcome i {
                font-size: 2.4rem;
                color: var(--accent);
            }

            .ai-welcome .text-group {
                display: flex;
                flex-direction: column;
                line-height: 1.2;
            }

            .ai-welcome h3 {
                margin: 0;
                font-size: 1.1rem;
                font-weight: 600;
                white-space: nowrap;
            }

            .ai-welcome p {
                margin: 2px 0 0 0;
                color: var(--sub);
                font-size: 0.85rem;
            }

        /* Hazır Kalıp Soru Butonları */
        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0 20px 0;
            justify-content: center;
        }

        .q-tag {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent);
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
            cursor: pointer;
            transition: 0.3s;
            width: fit-content;
            white-space: nowrap;
        }

            .q-tag:active {
                background: var(--accent);
                color: #0f172a;
                transform: scale(0.95);
            }

        /* Sohbet Alanı */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding: 10px 0;
            margin-bottom: 80px;
            scrollbar-width: none;
        }

            .chat-container::-webkit-scrollbar {
                display: none;
            }

        /* Mesaj Balonları */
        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

            .msg.ai {
                align-self: flex-start;
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--text);
                border-bottom-left-radius: 5px;
            }

            .msg.user {
                align-self: flex-end;
                background: var(--accent);
                color: white;
                border-bottom-right-radius: 5px;
            }

        /* Alt Menü Sabitleme */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="ai-welcome">
            <i class="fa-solid fa-brain"></i>

            <div class="text-group">
                <h3>Guardia Akıllı Asistan</h3>
                <p>Bir soru seçerek başlayabilirsin, Ayşe</p>
            </div>
        </div>

        <div class="quick-questions">
            <div class="q-tag" onclick="askAI('Maaş ödemeleri ne zaman?')">💰 Maaş Günü?</div>
            <div class="q-tag" onclick="askAI('Vardiya bilgilerim nedir?')">🕒 Vardiyam?</div>
            <div class="q-tag" onclick="askAI('İzin hakkım ne kadar?')">📅 İzin Bakiyem?</div>
            <div class="q-tag" onclick="askAI('Yemek menüsünde ne var?')">🍽️ Yemek Menüsü</div>
            <div class="q-tag" onclick="askAI('Arıza bildirimi nasıl yapılır?')">🔧 Arıza Bildirimi</div>
        </div>

        <div class="chat-container" id="chatBox">
            <div class="msg ai">Merhaba! Ben Guardia AI. Merak ettiğin konuyu yukarıdaki butonlara tıklayarak
                sorabilirsin.</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="p-index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Panel</span></a>
        <a href="p-ai.html" class="nav-item active"><i class="fa-solid fa-brain"></i><span>AI</span></a>
        <a href="p-qr.html" class="nav-item"><i class="fa-solid fa-qrcode"></i><span>QR</span></a>
        <a href="p-ayarlar.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Ayarlar</span></a>
    </nav>

    <script>

        function apiFetch(url, options = {}) {
            const token = localStorage.getItem('token');

            // Başlıkları koruyarak Authorization JWT token'ını mühürlüyoruz
            options.headers = {
                ...options.headers,
                'Authorization': 'Bearer ' + token
            };

            return fetch(url, options).then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP Hatası! Durum: ${res.status}`);
                }
                return res;
            });
        }

        // Tema kontrolü
        if (localStorage.getItem('temaTercihi') === 'light') document.body.classList.add('light-mode');

        const chatBox = document.getElementById('chatBox');

        async function askAI(question) {
            // 1. Kullanıcı mesajını ekrana bas
            chatBox.innerHTML += `<div class="msg user">${question}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Yükleniyor balonunu oluştur
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="msg ai" id="${loadingId}">...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Hafızadaki sicil numarasını al (Vardiya bilgisi için şart)
            const aktifSicilNo = localStorage.getItem("aktifKullanici");

            try {
                // 4. C# API'sine istek at
                const response = await apiFetch('https://localhost:7183/api/ai/soru-sor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        soru: question,
                        sicilNo: aktifSicilNo // Veritabanından vardiya çekmek için gönderiyoruz
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const loadingElem = document.getElementById(loadingId);

                    if (loadingElem) {
                        // AI cevabındaki yıldızları temizle ve ekrana yaz
                        let temizMetin = data.cevap.replace(/\*/g, '');
                        loadingElem.innerHTML = temizMetin;
                        loadingElem.removeAttribute('id');
                    }
                } else {
                    const loadingElem = document.getElementById(loadingId);
                    if (loadingElem) loadingElem.innerHTML = "Sistem şu an meşgul (Hata: " + response.status + ")";
                }

            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.innerHTML = "Bağlantı hatası! C# projen çalışıyor mu?";
                console.error("Hata detayı:", error);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>

</html>
