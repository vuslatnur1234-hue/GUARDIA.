<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardia | Kurtarma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* CSS Değişkenleri: Tema renkleri ve genel ayarlar */
        :root {
            --primary: #38bdf8; /* Vurgu rengi */
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); /* Arka plan geçişi */
            --glass: rgba(255, 255, 255, 0.03); /* Saydam cam arka plan efekti */
            --border: rgba(255, 255, 255, 0.1); /* Kenarlık rengi */
        }

        /* Sayfa gövdesi sıfırlama, ortalama ve font ayarı */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-grad);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden; /* Dikey kaydırmayı kapat */
        }

        /* Kurtarma formu taşıyıcı kutusu */
        .recovery-card {
            width: 85%;
            max-width: 380px;
            padding: 40px 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }

        /* Adım göstergesi kapsayıcısı */
        .step-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .dot {
            width: 30px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            transition: 0.4s;
        }

            .dot.active {
                background: var(--primary);
                box-shadow: 0 0 10px var(--primary);
            }

        /* Başlık üstündeki ikon kutusu */
        .icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
            font-size: 1.8rem;
        }

        /* Başlık stili */
        h2 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            font-weight: 600;
        }
        /* Açıklama metni stili */
        p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Girdi alanı sarmalayıcısı */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
            /* Girdi alanı içerisindeki ikonun konumu */
            .input-group i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: rgba(255,255,255,0.3);
            }

        /* Girdi stili */
        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
            /* Girdi alanına tıklanınca uygulanacak stil */
            input:focus {
                border-color: var(--primary);
                background: rgba(255,255,255,0.1);
            }

        /* İleri/Onayla Butonu stili */
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 15px;
            color: #0f172a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
            /* Butona tıklanma animasyonu */
            .btn:active {
                transform: scale(0.97);
            }

        /* Geri dön bağlantısı stili */
        .back-btn {
            margin-top: 25px;
            display: inline-block;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.85rem;
        }

            .back-btn:hover {
                color: var(--primary);
            }

        /* Adımlar arası geçişte kullanılacak yumuşak belime animasyonu sınıfı */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        /* Animasyon tanımı */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Test Banner Stilleri */
        .test-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--primary);
            color: #0f172a;
            text-align: center;
            padding: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

            .test-banner.show {
                transform: translateY(0);
            }
    </style>
</head>
<body>

    <div id="test-banner" class="test-banner">
        <i class="fa-solid fa-flask"></i> TEST MODU - SMS KODUNUZ: <span id="test-code-display"></span>
    </div>

    <div class="recovery-card">
        <div class="step-dots">
            <div id="dot1" class="dot active"></div>
            <div id="dot2" class="dot"></div>
            <div id="dot3" class="dot"></div>
        </div>

        <div id="step1" class="fade-in">
            <div class="icon-circle"><i class="fa-solid fa-id-card"></i></div>
            <h2>Sicil Doğrulama</h2>
            <p>Devam etmek için size atanan 4-6 haneli sicil numaranızı girin.</p>
            <div class="input-group">
                <i class="fa-solid fa-hashtag"></i>
                <input type="text" id="sicil-input" placeholder="Sicil No">
            </div>
            <button class="btn" onclick="goToStep2()">KOD GÖNDER</button>
        </div>

        <div id="step2" style="display: none;" class="fade-in">
            <div class="icon-circle"><i class="fa-solid fa-comment-sms"></i></div>
            <h2>SMS Doğrulama</h2>
            <p>Sistemdeki telefonunuza gelen kodu girin.</p>
            <div class="input-group">
                <i class="fa-solid fa-unlock-keyhole"></i>
                <input type="text" id="sms-input" placeholder="6 Haneli Kod">
            </div>
            <button class="btn" onclick="goToStep3()">DOĞRULA</button>
        </div>

        <div id="step3" style="display: none;" class="fade-in">
            <div class="icon-circle"><i class="fa-solid fa-lock"></i></div>
            <h2>Yeni Şifre</h2>
            <p>Son 3 şifrenizden farklı ve en az 6 karakterli bir şifre belirleyin.</p>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="p1" placeholder="Yeni Şifre">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-check-double"></i>
                <input type="password" id="p2" placeholder="Şifre Tekrar">
            </div>
            <button class="btn" onclick="finish()">ŞİFREYİ SIFIRLA</button>
        </div>

        <a href="p-login.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i> Girişe Dön</a>
    </div>

    <script>
        async function goToStep2() {
            const sicilInput = document.getElementById('sicil-input').value.trim();
            if (!sicilInput) { alert("Sicil numaranızı giriniz."); return; }

            const response = await fetch('https://localhost:7183/api/psifreunuttum/sicildogrula', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ SicilNo: sicilInput })
            });

            if (response.ok) {
                const data = await response.json();

             
                document.getElementById('test-code-display').innerText = data.smsKodu;
                document.getElementById('test-banner').classList.add('show');

                document.getElementById('sms-input').value = data.smsKodu;

                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('dot2').classList.add('active');
            } else {
                alert("Sicil numarası bulunamadı.");
            }
        }

        async function goToStep3() {
            const kod = document.getElementById('sms-input').value;
            const response = await fetch('https://localhost:7183/api/psifreunuttum/smsdogrula', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Kod: kod })
            });

            if (response.ok) {
            
                document.getElementById('test-banner').classList.remove('show');

                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
                document.getElementById('dot3').classList.add('active');
            } else {
                alert("SMS kodu hatalı!");
            }
        }

        async function finish() {
      
            const sicil = document.getElementById('sicil-input').value.trim();
            const p1 = document.getElementById('p1').value;
            const p2 = document.getElementById('p2').value;

            const response = await fetch('https://localhost:7183/api/psifreunuttum/sifresifirla', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // SicilNo parametresini de pakete ekliyoruz
                body: JSON.stringify({ SicilNo: sicil, YeniSifre: p1, YeniSifreTekrar: p2 })
            });

            const sonuc = await response.json();
            alert(sonuc.mesaj);
            if (response.ok) location.href = 'p-login.html';
        }
    </script>
</body>
</html>
