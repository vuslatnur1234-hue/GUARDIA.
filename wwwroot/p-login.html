<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <!-- Mobil uyumluluk için viewport ayarı -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guardia | Personel Girişi</title>
    <!-- İkon kütüphanesi (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Renk paleti ve genel değişkenler */
        :root {
            --primary: #38bdf8;
            /* Ana vurgu rengi */
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            /* Arka plan geçişi */
            --glass: rgba(255, 255, 255, 0.03);
            /* Cam efekti arka planı */
            --border: rgba(255, 255, 255, 0.1);
            /* Kenarlık rengi */
            --sub: rgba(255, 255, 255, 0.5);
            /* Alt metin rengi */
        }

        /* Sayfa geneli sıfırlama ve yerleşim ayarları */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-grad);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            /* Kaydırmayı engelle */
        }

        /* Giriş formu taşıyıcı kutusu (Glassmorphism efekti) */
        .login-container {
            width: 85%;
            max-width: 380px;
            padding: 40px 30px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            /* Arka planı bulanıklaştır */
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Logo ve başlık alanı */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

            .brand i {
                font-size: 2.5rem;
                color: var(--primary);
                filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
            }

            .brand h1 {
                margin: 0;
                font-size: 1.8rem;
                letter-spacing: 2px;
                font-weight: 600;
            }

        /* Girdi alanları sarmalayıcısı */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

            .input-group i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: rgba(255, 255, 255, 0.4);
            }

        /* Metin ve şifre giriş kutuları */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        /* Girdi alanı odaklanma durumu */
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Beni hatırla ve şifremi unuttum bağlantısı alanı */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -5px;
            margin-bottom: 25px;
            padding: 0 5px;
        }

            /* Beni hatırla etiketi */
            .remember-forgot label {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--sub);
                font-size: 0.8rem;
                cursor: pointer;
            }

            /* Şifremi unuttum bağlantısı */
            .remember-forgot a {
                color: var(--primary);
                font-size: 0.8rem;
                text-decoration: none;
                font-weight: 600;
            }

        /* Giriş yap butonu */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 15px;
            color: #0f172a;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }

            /* Buton tıklanma efekti */
            .login-btn:active {
                transform: scale(0.98);
            }

        /* Küçük ekranlar için responsive ayarlar */
        @media (max-height: 700px) {
            .login-container {
                padding: 30px 20px;
            }

            .brand {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Ana giriş konteyneri -->
    <div class="login-container">
        <!-- Marka logosu ve ismi -->
        <div class="brand">
            <i class="fa-solid fa-shield-halved"></i>
            <h1>GUARDIA</h1>
        </div>

        <!-- Sicil numarası giriş alanı -->
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Sicil No" autocomplete="off">
        </div>

        <!-- Şifre giriş alanı -->
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Şifre">
        </div>

        <!-- Beni hatırla onay kutusu ve şifre sıfırlama linki -->
        <div class="remember-forgot">
            <label>
                <input type="checkbox" id="rememberMe" style="accent-color: var(--primary);">
                Beni Hatırla
            </label>
            <a href="p-sifre-unuttum.html">Şifremi Unuttum?</a>
        </div>

        <button class="login-btn" onclick="girisYap()">GİRİŞ YAP</button>
    </div>

    <script>
        let hataliDeneme = 0;

        async function girisYap() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            const btn = document.querySelector('.login-btn');

            if (!u || !p) {
                alert("Lütfen sicil numaranızı ve şifrenizi giriniz.");
                return;
            }

            // api
            try {
                const response = await fetch('https://localhost:7183/api/personelgiris/giris', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ SicilNo: u, Sifre: p })
                });


                if (response.ok) {
                    const responseData = await response.text();
                    let gecerliToken = "";

                    try {
                        const jsonData = JSON.parse(responseData);

                        gecerliToken = jsonData.token || jsonData.Token;
                    } catch (e) {
                        if (/^[\x00-\x7F]*$/.test(responseData)) {
                            gecerliToken = responseData;
                        }
                    }

                    if (!gecerliToken || gecerliToken.length < 10) {
                        alert("API'den geçerli bir Token dönmedi! Sunucu yanıtı: " + responseData);
                        return;
                    }

                    if (remember) {
                        localStorage.setItem("rememberedUser", u);
                        localStorage.setItem("rememberedPass", p);
                    } else {
                        localStorage.removeItem("rememberedUser");
                        localStorage.removeItem("rememberedPass");
                    }

                    localStorage.setItem("aktifKullanici", u);
                    localStorage.setItem("token", gecerliToken);
                    localStorage.setItem('vardiyaBaslangic', Date.now().toString());

                    btn.innerText = "GİRİŞ YAPILIYOR...";
                    btn.style.opacity = "0.7";
                    hataliDeneme = 0;

                    setTimeout(() => {
                        location.href = "p-index.html";
                    }, 800);

                } else {
                    hataliDeneme++;

                    if (hataliDeneme >= 3) {
                        btn.disabled = true;
                        btn.style.background = "#475569";
                        btn.innerText = "HESAP KİLİTLENDİ (30sn)";
                        alert("3 kez hatalı giriş yapıldı! Güvenlik nedeniyle hesabınız 30 saniye kilitlendi.");

                        setTimeout(() => {
                            btn.disabled = false;
                            btn.style.background = "var(--primary)";
                            btn.innerText = "GİRİŞ YAP";
                            hataliDeneme = 0;
                        }, 30000);
                    } else {
                        alert(`Hatalı Sicil No veya Şifre! Kalan deneme hakkı: ${3 - hataliDeneme}`);
                    }
                }
            } catch (error) {
                alert("Sunucuya bağlanılamadı. Lütfen C# projesinin çalıştığından emin olun.");
            }
        }
        // Sayfa açılınca beni hatırla kontrolü
        window.onload = function () {
            const remembered = localStorage.getItem('rememberedUser');
            const rememberedPass = localStorage.getItem('rememberedPass');
            if (remembered) {
                document.getElementById('username').value = remembered;
                document.getElementById('rememberMe').checked = true;
            }
            if (rememberedPass) {
                document.getElementById('password').value = rememberedPass;
            }
        }
    </script>
</body>

</html>
