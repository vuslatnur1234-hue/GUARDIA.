<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Guardia | Yönetim Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {

            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --accent: #38bdf8;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-grad);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .logo-area i {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 10px;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 18px;
            color: rgba(56, 189, 248, 0.5);
        }

        input {
            width: 100%;
            padding: 16px 15px 16px 45px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.8);
        }


        .admin-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            text-transform: uppercase;

        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
            filter: brightness(1.05);

        }

        .footer-links {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #64748b;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo-area">
            <i class="fa-solid fa-building-shield"></i>
            <h1>GUARDIA CENTRAL</h1>
            <p>Kurumsal Yönetim ve Departman Erişimi</p>
        </div>

        <div class="input-wrapper">
            <i class="fa-solid fa-id-badge"></i>
            <input type="text" id="adminID" placeholder="Yönetici Sicil No">
        </div>

        <div class="input-wrapper">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="adminPass" placeholder="Erişim Şifresi">
        </div>

        <button class="admin-btn" onclick="yoneticiGirisi()">SİSTEME BAĞLAN</button>

        <div class="footer-links">
            <a href="admin-sifre-unuttum.html">Şifremi Unuttum</a>
        </div>
    </div>

    <script>
        let denemeSayisi = 0;

        async function yoneticiGirisi() {
            const id = document.getElementById('adminID').value.trim();
            const pass = document.getElementById('adminPass').value;
            const btn = document.querySelector('.admin-btn');

            if (!id || !pass) {
                alert("Sistem Güvenliği: Yönetici kimlik bilgileri boş bırakılamaz.");
                return;
            }

            const orijinalMetin = btn.innerText;
            btn.innerText = "BAĞLANILIYOR...";
            btn.disabled = true;

            try {
                const response = await fetch('https://localhost:7183/api/IkYetkiKontrolcusu/giris-yap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "adminId": id,
                        "adminPass": pass
                    })
                });

                const data = await response.json();

                
                const isBasarili = data.basarili === true || data.Basarili === true;

                if (response.ok && isBasarili) {
                    const payload = data.veri || data.Veri || data;

                    btn.innerText = "YETKİ ONAYLANDI...";
                    btn.style.background = "#10b981";

                    const adSoyadBilgisi = payload.adSoyad || payload.AdSoyad;
                    const departmanBilgisi = payload.departmanAdi || payload.DepartmanAdi;
                    const sicilBilgisi = payload.sicilNo || payload.SicilNo || id;
                    const hedefSayfaBilgisi = payload.hedefSayfa || payload.HedefSayfa;
                    const tokenBilgisi = payload.token || payload.Token || payload.accessToken;

                    localStorage.setItem("token", tokenBilgisi);
                    localStorage.setItem("adminDepartman", departmanBilgisi);
                    localStorage.setItem("adminAdSoyad", adSoyadBilgisi);
                    localStorage.setItem("adminSicilNo", sicilBilgisi);

                    setTimeout(() => {
                        location.href = hedefSayfaBilgisi;
                    }, 1000);
                } else {
                  
                    denemeSayisi++;
                    btn.innerText = orijinalMetin;
                    btn.disabled = false;

                    const hataMesaji = data.hataMesaji || data.HataMesaji || data.mesaj || "Giriş reddedildi. Bilgileri kontrol edin.";
                    alert(`Sistem Uyarısı: ${hataMesaji}\nBaşarısız Deneme: ${denemeSayisi}`);
                }
            } catch (error) {
                
                console.error("JavaScript Çökme Hatası:", error);
                btn.innerText = "SİSTEME BAĞLAN";
                btn.disabled = false;
                alert("Kodun işlenmesi sırasında bir hata oluştu. Lütfen F12 -> 'Console' sekmesindeki kırmızı hatayı kontrol edin.");
            }
        }
    </script>
</body>

</html>
